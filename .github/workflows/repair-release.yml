name: 修复草稿 Release

# GitHub 的规则：Release 关联的 tag 一旦消失，这个 Release 会被打回草稿。
# 你们的仓库是 Gitea --mirror 强推到 GitHub，镜像会把 GitHub 上多出来的
# tag 剪掉，于是"过一段时间自己变成草稿"。
#
# 真正的修复是让 tag 同时存在于 Gitea（package.yml 里的同步步骤 + GITEA_TOKEN）。
# 这个工作流是兜底：定期把被打回草稿的 Release 重新发布，必要时把 tag 补回来。
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-release
  cancel-in-progress: false

jobs:
  repair:
    name: 修复草稿
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码（需要完整历史来找 tag 目标）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 重新发布草稿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' > /tmp/drafts.txt || true

          if [ ! -s /tmp/drafts.txt ]; then
            echo "没有草稿 Release，收工"
            exit 0
          fi

          failed=0
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "==> 处理 $tag"

            # tag 被镜像剪掉了就先补回来，否则 Release 无法正式发布
            if ! git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
              if [ -n "$target" ] && git rev-parse "$target" >/dev/null 2>&1; then
                echo "    tag 缺失，从 $target 重建"
                git tag "$tag" "$target" || true
                git push origin "refs/tags/$tag" || echo "::warning::无法推送 tag $tag"
              else
                echo "::warning::$tag 的目标提交 $target 不存在，跳过"
                failed=1
                continue
              fi
            fi

            if gh release edit "$tag" --draft=false --latest; then
              echo "    已正式发布"
            else
              echo "::warning::发布 $tag 失败"
              failed=1
            fi
          done < /tmp/drafts.txt

          if [ "$failed" -ne 0 ]; then
            echo "::error::有 Release 没能修复，需要人工看一下"
            exit 1
          fi
